<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Chuẩn Material 3 — Hôm nay</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7FBF2;--pri:#386A20;--pc:#B8F397;--onpc:#042100;--sv:#E0E4D6;--ink:#1A1C18;--ink2:#43483E;--err:#BA1A1A;--sc:#EDF1E6}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--bg);font-family:Roboto,system-ui,sans-serif;color:var(--ink);position:relative}
.sb{height:28px}
.bar{display:flex;align-items:center;padding:4px 8px 8px 16px}
.bar h1{flex:1;font-size:22px}.ib{width:40px;height:40px;display:grid;place-items:center;font-size:22px;color:var(--ink2)}
.chip{margin:0 16px;display:inline-flex;padding:6px 12px;border-radius:8px;border:1px solid #74796D;font-size:14px;color:var(--ink2)}
.ring{width:200px;height:200px;margin:20px auto 0;border-radius:50%;background:conic-gradient(var(--pri) 0 80%,var(--sv) 80% 100%);display:grid;place-items:center}
.ring div{width:164px;height:164px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
.ring b{font-size:36px;display:block}.ring span{font-size:13px;color:var(--ink2)}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:20px 16px 0}
.c{background:var(--sc);border-radius:12px;padding:12px}
.c .l{font-size:12px;color:var(--ink2)}.c .n{font-size:18px;font-weight:500;margin-top:4px}
.c .t{height:4px;border-radius:2px;background:var(--sv);margin-top:8px;overflow:hidden}.c .t i{display:block;height:100%;background:var(--pri)}
.c.e .n{color:var(--err)}.c.e .t i{background:var(--err);width:100%}
.sec{margin:20px 16px 0}
.sec h2{font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.row{display:flex;justify-content:space-between;padding:12px 0;font-size:16px}
.row span:last-child{color:var(--ink2);font-size:14px}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-size:28px;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#EBEFE5;display:flex;justify-content:space-around;align-items:center}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink2)}
.nav i{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;font-style:normal}
.nav .on i{background:var(--pc)}
</style></head><body>
<div class="sb"></div>
<header class="bar"><h1>Hôm nay</h1><div class="ib">📅</div></header>
<div class="chip">Thứ Tư, 04/11/2026</div>
<div class="ring"><div><span><b>412</b>kcal còn lại</span></div></div>
<section class="cards">
  <div class="c"><div class="l">Đạm</div><div class="n">78/112 g</div><div class="t"><i style="width:70%"></i></div></div>
  <div class="c e"><div class="l">Natri</div><div class="n">2.350 mg</div><div class="t"><i></i></div></div>
  <div class="c"><div class="l">Đường</div><div class="n">21/26 g</div><div class="t"><i style="width:81%"></i></div></div>
</section>
<section class="sec"><h2>Bữa sáng</h2><div class="row"><span>Bánh mì trứng</span><span>380 kcal</span></div><div class="row"><span>Cà phê sữa đá</span><span>120 kcal</span></div></section>
<section class="sec"><h2>Bữa trưa</h2><div class="row"><span>Bún nạm</span><span>450 kcal</span></div></section>
<div class="fab">+</div>
<nav class="nav"><div class="on"><i>◉</i>Hôm nay</div><div><i>▥</i>Biểu đồ</div><div><i>⚙</i>Cài đặt</div></nav>
</body></html>
