version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK pins these together; upgrade them with `npx expo install --fix` / an SDK bump PR.
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "jest-expo"
          - "@types/react"
    ignore:
      # Expo SDK 58 pins these; `npx expo install --check` must stay clean (issue #7).
      # Upgrade them only with an SDK bump PR using `npx expo install --fix`.
      # Exact-pinned by the SDK: ignore every update.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
      # Expo packages: patch updates within the SDK line are fine; minor/major come with an SDK bump.
      - dependency-name: "expo"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      # Tooling majors the SDK does not support yet (TypeScript ~6.0 pinned; eslint-config-expo on ESLint 9).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /e2e/mobile-appium
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
