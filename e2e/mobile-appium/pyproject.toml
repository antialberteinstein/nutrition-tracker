[project]
name = "nutrition-tracker-e2e"
version = "0.1.0"
description = "Appium (UiAutomator2) E2E tests for the Nutrition Tracker Android app. Run via scripts/run-test.sh."
requires-python = ">=3.12"
dependencies = [
    "appium-python-client>=6.1.4",
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
